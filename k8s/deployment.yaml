apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-admission-webhook
  namespace: default
  labels:
    app: k8s-admission-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-admission-webhook
  template:
    metadata:
      labels:
        app: k8s-admission-webhook
    spec:
      containers:
        - name: webhook
          image: k8s-admission-webhook:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: webhook-server-tls

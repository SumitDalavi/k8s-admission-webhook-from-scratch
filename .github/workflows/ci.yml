name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: go mod download

    - name: Run Unit Tests
      run: go test -v ./pkg/...

    - name: Run Integration Tests
      run: go test -v ./tests/...

    - name: Build Webhook
      run: go build -o webhook ./cmd/webhook
